<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2b3e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hallway" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Hallway — Conference &amp; Relationship Intelligence · Wolf Street</title>
    <meta name="description" content="Hallway, part of the Wolf Street suite: the conference and relationship workspace for business development teams. Capture every signal, coordinate every follow-up, and enter every opportunity informed." />
    <meta name="author" content="Wolf Street" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hallway — Conference &amp; Relationship Intelligence" />
    <meta property="og:description" content="Capture meetings, conferences, relationships, and follow-ups in one intelligent BD workspace." />
    <meta property="og:site_name" content="Hallway · Wolf Street" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Wolf Street theme (v1.2) before first paint: saved choice, else the computer's setting.
      (function () {
        try {
          var p = localStorage.getItem("ws-theme-pref");
          var dark = p === "dark" || ((p !== "light") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
